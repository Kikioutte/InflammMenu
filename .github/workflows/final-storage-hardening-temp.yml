name: Final storage hardening

on:
  push:
    branches: [agent/audit-remediation]
    paths:
      - scripts/fix-empty-backup-wrapper.py
      - .github/workflows/final-storage-hardening-temp.yml

permissions:
  contents: write

concurrency:
  group: final-storage-hardening
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out correction branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/audit-remediation
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply the final storage validation
        run: python3 scripts/fix-empty-backup-wrapper.py

      - name: Validate storage and the complete non-browser suite
        run: |
          git diff --check
          npm run test:storage
          npm run test:preview
          npm run build:pages

      - name: Commit validated source changes
        run: |
          git config user.name "InflammMenu audit remediation"
          git config user.email "148545599+Kikioutte@users.noreply.github.com"
          git rm scripts/fix-empty-backup-wrapper.py
          git restore --source=HEAD --staged --worktree .github/workflows
          git add src/storage.ts tests/storage.test.mjs
          git diff --cached --check
          git commit -m "Refuser les sauvegardes enveloppées mais vides"
          git push origin HEAD:agent/audit-remediation
