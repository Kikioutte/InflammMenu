name: Export source snapshot

on:
  push:
    branches: [agent/audit-remediation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package tracked source tree
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/source-snapshot.tgz" HEAD

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: ${{ runner.temp }}/source-snapshot.tgz
          retention-days: 1
