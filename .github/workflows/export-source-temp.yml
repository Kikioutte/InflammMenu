name: Export exact dependencies

on:
  push:
    branches: [agent/audit-remediation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Generate corrected lockfile and install exact dependencies
        run: |
          npm pkg set overrides.postcss=8.5.24
          npm install --package-lock-only --ignore-scripts
          npm ci
          node -e "const lock=require('./package-lock.json'); console.log('postcss='+lock.packages['node_modules/postcss'].version)"
          tar -czf "$RUNNER_TEMP/node-modules.tgz" node_modules

      - name: Upload validation dependencies
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remediation-dependencies
          path: |
            package-lock.json
            ${{ runner.temp }}/node-modules.tgz
          retention-days: 1
