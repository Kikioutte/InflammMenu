name: Consolidate audit remediation

on:
  push:
    branches: [agent/audit-remediation]
    paths:
      - scripts/apply-audit-remediation-consolidation.py
      - .github/workflows/consolidate-remediation-temp.yml

permissions:
  contents: write

concurrency:
  group: audit-remediation-consolidation
  cancel-in-progress: true

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Let the initial remediation workflow finish
        run: sleep 360

      - name: Check out the latest correction branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/audit-remediation
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install current locked dependencies
        run: npm ci

      - name: Complete the initial remediation if it has not committed yet
        run: |
          if ! grep -q 'stateRevision: number' src/storage.ts; then
            test -f scripts/apply-audit-remediation-core.py
            test -f scripts/apply-audit-remediation-ui-pwa.py
            test -f scripts/apply-planner-caution-split.py
            test -f scripts/finalize-audit-remediation.py
            python3 scripts/apply-audit-remediation-core.py
            python3 scripts/apply-audit-remediation-ui-pwa.py
            python3 scripts/apply-planner-caution-split.py
            python3 scripts/finalize-audit-remediation.py
          fi

      - name: Apply final consolidation
        run: python3 scripts/apply-audit-remediation-consolidation.py

      - name: Regenerate reviewed data and the npm lockfile
        run: |
          npm run generate:planner
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Validate unit suites and production build
        run: |
          git diff --check
          npm run check:runtime
          npm run test:preview
          npm run build:pages

      - name: Verify offline caution is actually precached
        run: |
          grep -q 'planner-cautions.json' dist/pages/sw.js
          test -s dist/pages/data/planner-cautions.json

      - name: Install Chromium for the browser suites
        run: npx playwright install --with-deps chromium

      - name: Validate application and mobile runtime in Chromium
        run: |
          npm run test:app
          npm run test:runtime

      - name: Validate the alternative deployment worker
        run: |
          npm run build
          npm run test:sites

      - name: Record the successful validation and remove temporary automation
        run: |
          cat > docs/remediation-2026-08-08.md <<'EOF'
          # Corrections de l’audit du 8 août 2026

          Cette branche corrige les anomalies confirmées relatives aux imports, au stockage, aux onglets multiples, aux semaines, aux repas verrouillés, aux restes, aux courses, aux exports, au catalogue hors ligne, au service worker, aux performances du catalogue, à l’accessibilité et à la CI.

          Le commit a été créé uniquement après réussite de :

          - l’intégrité du runtime ;
          - la suite `test:preview` ;
          - la compilation et le build GitHub Pages ;
          - la vérification du précache des précautions hors ligne ;
          - `test:app` sous Chromium ;
          - `test:runtime` sous Chromium ;
          - le build alternatif et `test:sites`.

          Les corrections restent sur une branche et une pull request en brouillon tant qu’elles ne sont pas fusionnées.
          EOF
          git config user.name "InflammMenu audit remediation"
          git config user.email "148545599+Kikioutte@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            scripts/apply-audit-remediation-core.py \
            scripts/apply-audit-remediation-ui-pwa.py \
            scripts/apply-planner-caution-split.py \
            scripts/finalize-audit-remediation.py \
            scripts/apply-audit-remediation-consolidation.py \
            .github/workflows/remediate-core-temp.yml \
            .github/workflows/finalize-remediation-temp.yml \
            .github/workflows/consolidate-remediation-temp.yml \
            .github/workflows/export-source-temp.yml
          git add -A
          git diff --cached --check
          git commit -m "Finaliser les corrections validées de l’audit"
          git push origin HEAD:agent/audit-remediation
