name: Apply core audit remediation

on:
  push:
    branches: [agent/audit-remediation]
    paths:
      - scripts/apply-audit-remediation-core.py
      - .github/workflows/remediate-core-temp.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out correction branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/audit-remediation
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply deterministic source transformations
        run: python3 scripts/apply-audit-remediation-core.py

      - name: Regenerate planner projection
        run: npm run generate:planner

      - name: Validate core fixes
        run: |
          git diff --check
          npm run check:runtime
          npm run test:storage
          npm run test:engine
          npm run test:catalogue
          npm run validate:planner
          npm run build:pages

      - name: Commit validated remediation
        run: |
          git config user.name "InflammMenu audit remediation"
          git config user.email "148545599+Kikioutte@users.noreply.github.com"
          git rm -f scripts/apply-audit-remediation-core.py .github/workflows/remediate-core-temp.yml
          git add src/domain.ts src/storage.ts src/engine.ts src/data/planner-recipes.json scripts/generate-planner-recipes.mjs tests/storage.test.mjs tests/engine.test.mjs
          git diff --cached --check
          git commit -m "Corriger les données et invariants métier"
          git push origin HEAD:agent/audit-remediation
