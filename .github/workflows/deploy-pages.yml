name: Validate and deploy GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Validate data and unit tests
        run: npm run test:preview

      - name: Install Chromium and WebKit for Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Test application journeys and mobile runtime
        run: npm run test:browser

      - name: Build alternative worker and test it
        run: npm run test:sites

      - name: Build GitHub Pages artifact
        run: npm run build:pages

      - name: Test installed PWA, offline catalogue and multi-tab sync
        run: npm run test:pwa:built

      - name: Upload site artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist/pages

  lighthouse-compare:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: validate-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Check out baseline before date formatting fix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 61ab40d963fcef53c25cd8f98d2ff56f73081d8e
          path: baseline
          persist-credentials: false

      - name: Set up Node.js for measurement
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            candidate/package-lock.json
            baseline/package-lock.json
            candidate/tools/lighthouse/package-lock.json

      - name: Build baseline
        working-directory: baseline
        run: npm ci && npm run build:pages

      - name: Build candidate
        working-directory: candidate
        run: npm ci && npm run build:pages

      - name: Install and check isolated measurement tools
        working-directory: candidate/tools/lighthouse
        run: npm ci && npm test

      - name: Install pinned Chromium for measurement
        working-directory: candidate/tools/lighthouse
        run: npx playwright install --with-deps chromium

      - name: Compare twelve cold mobile loads
        run: node candidate/tools/lighthouse/compare.mjs baseline candidate lighthouse-results

      - name: Preserve all Lighthouse reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lighthouse-comparison
          path: lighthouse-results/
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate-build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
