name: Final remediation verification

on:
  push:
    branches: [agent/audit-remediation]
    paths:
      - scripts/apply-audit-remediation-hotfix.py
      - .github/workflows/hotfix-remediation-temp.yml

permissions:
  contents: write

concurrency:
  group: audit-remediation-hotfix
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Wait for consolidation to finish
        run: sleep 420

      - name: Check out latest validated branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/audit-remediation
          persist-credentials: true

      - name: Require the consolidation proof
        run: test -s docs/remediation-2026-08-08.md

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Apply the final local-validation hotfix
        run: python3 scripts/apply-audit-remediation-hotfix.py

      - name: Install locked dependencies
        run: npm ci

      - name: Validate all non-browser checks and both builds
        run: |
          git diff --check
          npm run check:runtime
          npm run test:preview
          npm run build:pages
          grep -q 'planner-cautions.json' dist/pages/sw.js
          npm run build
          npm run test:sites

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run application and runtime browser suites
        run: |
          npm run test:app
          npm run test:runtime

      - name: Commit the final verified state
        run: |
          git config user.name "InflammMenu audit remediation"
          git config user.email "148545599+Kikioutte@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            scripts/apply-audit-remediation-hotfix.py \
            .github/workflows/hotfix-remediation-temp.yml
          git add -A
          git diff --cached --check
          git commit -m "Valider la correction finale de l’audit"
          git push origin HEAD:agent/audit-remediation
